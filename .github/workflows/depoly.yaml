name: Redirect /blog to the main site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Create redirect page
        run: |
          mkdir -p public
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://4sizn.github.io/">
              <link rel="canonical" href="https://4sizn.github.io/">
              <title>4sizn</title>
            </head>
            <body>
              <p><a href="https://4sizn.github.io/">4sizn 메인 블로그로 이동합니다.</a></p>
              <script>window.location.replace("https://4sizn.github.io/");</script>
            </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
