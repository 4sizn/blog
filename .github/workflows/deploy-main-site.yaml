name: Deploy site to 4sizn.github.io

# 이 저장소는 소스만 갖고 있고, 실제 사이트는 4sizn/4sizn.github.io 에서 서빙된다.
# (이 저장소의 GitHub Pages 는 depoly.yaml 이 만드는 리다이렉트 페이지다.)
#
# 필요한 설정: Settings → Secrets and variables → Actions 에
#   DEPLOY_TOKEN = 4sizn/4sizn.github.io 에 contents:write 권한이 있는 PAT
# 없으면 배포 단계에서 실패한다. 빌드까지는 정상 동작한다.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "deploy-main-site"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CreatedModifiedDate 가 git 이력에서 날짜를 읽는다

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # 잔디 데이터를 배포 시점 기준으로 갱신한다. 실패해도 커밋된
      # quartz/static/contributions.json 으로 빌드가 계속된다.
      - name: Refresh contribution graph
        run: node scripts/fetch-contributions.mjs
        continue-on-error: true

      - name: Build Quartz
        run: npx quartz build

      # Jekyll 이 _ 로 시작하는 경로를 걸러내지 않도록 막는다
      - name: Add .nojekyll
        run: touch public/.nojekyll

      # force push 대신 배포 저장소를 받아 파일만 갈아끼운다 — 그쪽 이력을 남긴다
      - name: Publish to 4sizn.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN 이 없어 배포를 건너뜁니다." >&2
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/4sizn/4sizn.github.io.git" out

          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a public/. out/

          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "변경 사항이 없어 배포를 건너뜁니다."
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA::7} from 4sizn/blog"
          git push
